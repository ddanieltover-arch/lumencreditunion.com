<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumenfield - Offline</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <style>
      :root {
        --teal-base: #0a3d3f;
        --teal-mid: #0f766e;
        --amber: #f5b942;
        --surface: #f4f7f6;
        --ink: #0e1b1f;
        --border: #dce5e3;
        --muted: #4a5b60;
        --warning-bg: #fff1cc;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--surface);
        color: var(--ink);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .container {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 40px 32px;
        max-width: 480px;
        width: 100%;
        box-shadow: 0 10px 25px -5px rgba(10, 61, 63, 0.08);
      }
      .icon-box {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background-color: #e3f3f1;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        color: var(--teal-base);
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        color: var(--teal-base);
        margin-bottom: 12px;
      }
      p {
        font-size: 14px;
        color: var(--muted);
        line-height: 1.6;
        margin-bottom: 24px;
      }
      .retry-btn {
        background-color: var(--amber);
        color: var(--ink);
        font-weight: 700;
        font-size: 14px;
        border: none;
        border-radius: 12px;
        padding: 14px 28px;
        cursor: pointer;
        min-height: 44px;
        min-width: 140px;
        transition: background-color 0.15s ease;
      }
      .retry-btn:hover {
        background-color: #f0d58a;
      }
      .retry-btn:focus-visible {
        outline: 3px solid var(--teal-mid);
        outline-offset: 2px;
      }
      .footer-note {
        margin-top: 24px;
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="card">
        <div class="icon-box" aria-hidden="true">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="1" y1="1" x2="23" y2="23"></line>
            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
            <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
            <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
            <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
            <line x1="12" y1="20" x2="12.01" y2="20"></line>
          </svg>
        </div>
        <h1>Connection Paused</h1>
        <p>
          You are currently offline. Lumenfield Credit Union requires a secure internet connection to access your accounts, verify authentication, and process transactions.
        </p>
        <button class="retry-btn" onclick="window.location.reload()" aria-label="Retry network connection and reload page">
          Retry Connection
        </button>
        <div class="footer-note">
          Once your network connection returns, your session will automatically resume.
        </div>
      </div>
    </main>
  </body>
</html>
